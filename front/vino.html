<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alta y edición de vino · Bodegas del Atuel</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header>
    <strong>Bodegas del Atuel</strong>
    <nav>
      <a href="index.html">Catálogo</a>
      <a href="vino.html" class="activa">Alta de vino</a>
      <a href="venta.html">Nueva venta</a>
      <a href="transferencias.html">Transferencias</a>
      <a href="tablero.html">Tablero</a>
    </nav>
  </header>

  <main>
    <h1 id="titulo">Alta de vino</h1>
    <p class="ayuda">Los porcentajes de las cepas tienen que sumar 100 (RN-05). Esta pantalla no los suma: si no dan 100, el error lo devuelve la API y no se guarda nada.</p>

    <form id="vino" class="panel">
      <div class="campos">
        <label>Nombre <input name="nombre"></label>
        <label>Tipo <select name="tipo"></select></label>
        <label>Añada <input name="anada" type="number"></label>
        <label>Volumen (ml) <input name="volumen_ml" type="number"></label>
        <label>Graduación (%) <input name="graduacion" type="number" step="0.01"></label>
        <label>Precio <input name="precio" type="number" step="0.01"></label>
        <label>Bodega <select name="cuit_bodega"></select></label>
      </div>

      <h2 style="margin-top: 18px">Composición</h2>
      <div id="cortes"></div>
      <button type="button" id="agregar-corte" class="secundario">+ Agregar cepa</button>

      <h2 style="margin-top: 18px">Maridajes</h2>
      <div id="maridajes" class="filtros"></div>

      <div id="aviso"></div>
      <div class="botones">
        <button type="submit">Guardar</button>
        <button type="button" id="borrar" class="peligro" hidden>Borrar vino</button>
      </div>
    </form>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/vino.js"></script>
</body>
</html>
